[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppke"
version = "0.1.0"
description = "Personal Philosophical Knowledge Engine - CLI tool for structured book analysis"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "anthropic>=0.39.0",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ppke = "ppke.cli:main"

[tool.setuptools.packages.find]
include = ["ppke*"]
