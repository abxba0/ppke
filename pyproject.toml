[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppke"
version = "0.1.0"
description = "Personal Philosophical Knowledge Engine - CLI tool for structured book analysis"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "anthropic>=0.39.0",
    "openai>=1.0",
    "google-generativeai>=0.7.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
# Vector database layer (fast semantic search without LLM)
vector = [
    "chromadb>=0.4.0",
]
# Knowledge graph layer (concept-level graph reasoning)
graph = [
    "networkx>=3.0",
]
# Full async file I/O (recommended for large corpora)
async = [
    "aiofiles>=23.0",
]
# Web GUI — FastAPI + Jinja2 + HTMX server
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
]
# Document converters — PDF, DOCX, images, OCR
ocr = [
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
]
# Audio — transcription input + TTS audio overviews
audio = [
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
]
# Phase 2: document intelligence — URL scraping, YouTube import, spreadsheets
ingest = [
    "trafilatura>=1.6.0",   # URL / article content extraction
    "requests>=2.31.0",     # HTTP fallback for URL scraping
    "yt-dlp>=2024.1.0",     # YouTube audio download
    "openpyxl>=3.1.0",      # Excel .xlsx support
]
# Phase 6: document export — PDF, DOCX, PPTX generation
export = [
    "weasyprint>=60.0",    # PDF generation from HTML/CSS
    "python-docx>=1.0.0",  # Word document generation
    "python-pptx>=0.6.21", # PowerPoint slide deck generation
]
# All optional extras at once
all = [
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "aiofiles>=23.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "trafilatura>=1.6.0",
    "requests>=2.31.0",
    "yt-dlp>=2024.1.0",
    "openpyxl>=3.1.0",
    "weasyprint>=60.0",
    "python-pptx>=0.6.21",
]

[tool.pytest.ini_options]
testpaths = ["ppke/tests"]

[tool.coverage.run]
source = ["ppke"]
omit = ["ppke/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[project.scripts]
ppke = "ppke.cli:main"

[tool.setuptools.packages.find]
include = ["ppke*"]
