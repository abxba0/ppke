[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppke"
version = "3.0.0"
description = "Personal & Professional Knowledge Engine - CLI + Web platform for structured knowledge extraction and analysis"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "anthropic>=0.39.0",
    "openai>=1.0",
    "google-generativeai>=0.7.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
# Vector database layer (fast semantic search without LLM)
vector = [
    "chromadb>=0.4.0",
]
# Knowledge graph layer (concept-level graph reasoning)
graph = [
    "networkx>=3.0",
]
# Full async file I/O (recommended for large corpora)
async = [
    "aiofiles>=23.0",
]
# Web GUI — FastAPI + Jinja2 + HTMX server
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
]
# Document converters — PDF, DOCX, images, OCR
ocr = [
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
]
# Audio — transcription input + TTS audio overviews
audio = [
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
]
# Speaker diarization — identifies 'who spoke when'
diarization = [
    "pyannote.audio>=3.1",
]
# PDF table structure detection
tables = [
    "pdfplumber>=0.10.0",   # PDF table extraction
]
# Image preprocessing for OCR (deskew, denoise, contrast)
preprocess = [
    "opencv-python-headless>=4.8.0",  # OpenCV image processing
]
# Video import — lecture video transcription + slide detection
video = [
    # Requires ffmpeg on PATH (system package)
    # Audio transcription uses the existing audio/openai dependency
]
# Phase 2: document intelligence — URL scraping, YouTube import, spreadsheets
ingest = [
    "trafilatura>=1.6.0",   # URL / article content extraction
    "requests>=2.31.0",     # HTTP fallback for URL scraping
    "yt-dlp>=2024.1.0",     # YouTube audio download
    "openpyxl>=3.1.0",      # Excel .xlsx support
]
# Phase 6: document export — PDF, DOCX, PPTX generation
export = [
    "weasyprint>=60.0",    # PDF generation from HTML/CSS
    "python-docx>=1.0.0",  # Word document generation
    "python-pptx>=0.6.21", # PowerPoint slide deck generation
]
# Phase 7: authentication & multi-tenant support
auth = [
    "PyJWT>=2.8.0",        # JWT token handling
    "bcrypt>=4.0.0",       # Password hashing
    "resend>=2.0.0",       # Transactional email (Resend API)
    "supabase>=2.0.0",     # Supabase client (optional auth/DB backend)
]
# Phase 8: deployment & infrastructure
infra = [
    "celery[redis]>=5.3.0",    # Distributed task queue
    "redis>=5.0.0",            # Redis client (caching + broker)
    "psycopg2-binary>=2.9.0",  # PostgreSQL driver
    "prometheus-client>=0.20.0", # Prometheus metrics
    "sentry-sdk[fastapi]>=1.40.0", # Error tracking
    "boto3>=1.34.0",           # AWS S3 object storage
    "google-cloud-storage>=2.14.0", # GCS object storage
]
# All optional extras at once
all = [
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "aiofiles>=23.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "pyannote.audio>=3.1",
    "trafilatura>=1.6.0",
    "requests>=2.31.0",
    "yt-dlp>=2024.1.0",
    "openpyxl>=3.1.0",
    "weasyprint>=60.0",
    "python-pptx>=0.6.21",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "resend>=2.0.0",
    "supabase>=2.0.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=1.40.0",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "pdfplumber>=0.10.0",
    "opencv-python-headless>=4.8.0",
]

[tool.pytest.ini_options]
testpaths = ["ppke/tests"]

[tool.coverage.run]
source = ["ppke"]
omit = [
    "ppke/tests/*",
    "ppke/parser/models_v1_backup.py",
    "ppke/llm/prompts_v1_backup.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[project.scripts]
ppke = "ppke.cli:main"

[tool.setuptools.packages.find]
include = ["ppke*"]
