<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PPKE{% endblock %} — Knowledge Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af',
                            900: '#1e3a5f',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .chat-bubble { max-width: 85%; }
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .prose h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
        .spinner { border: 3px solid #e5e7eb; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 text-gray-900">

<!-- Navigation -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-8">
                <a href="/" class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">PK</span>
                    </div>
                    <span class="text-xl font-bold text-gray-900">PPKE</span>
                </a>
                <div class="hidden md:flex space-x-6">
                    <a href="/" class="text-gray-600 hover:text-brand-600 font-medium transition-colors">Library</a>
                    <a href="/upload" class="text-gray-600 hover:text-brand-600 font-medium transition-colors">Upload</a>
                    <a href="/graph" class="text-gray-600 hover:text-brand-600 font-medium transition-colors">Graph</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="search" id="global-search" placeholder="Search across all books..."
                           class="w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                           hx-get="/api/search" hx-trigger="keyup changed delay:300ms" hx-target="#search-results"
                           hx-include="this" name="q">
                    <svg class="absolute left-3 top-2.5 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div id="search-results" class="absolute top-16 right-4 w-96 bg-white border rounded-lg shadow-xl z-50 hidden max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>
</nav>

<!-- Main content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="border-t border-gray-200 bg-white mt-12">
    <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
        PPKE v2.0 — Personal &amp; Professional Knowledge Engine
    </div>
</footer>

<script>
// Global search results handler
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.elt.id === 'global-search') {
        const resultsDiv = document.getElementById('search-results');
        const q = evt.detail.elt.value.trim();
        if (q.length > 0) {
            try {
                const data = JSON.parse(evt.detail.xhr.responseText);
                if (data.results && data.results.length > 0) {
                    let html = '<div class="p-3 border-b bg-gray-50 text-xs text-gray-500 font-medium">' +
                               data.total + ' results for "' + data.query + '"</div>';
                    data.results.slice(0, 10).forEach(r => {
                        html += '<a href="/notebook/' + r.folder + '" class="block p-3 hover:bg-blue-50 border-b">' +
                                '<div class="font-medium text-sm text-gray-900">' + r.topic + '</div>' +
                                '<div class="text-xs text-gray-500 mt-1">' + r.book + ' &middot; ' + r.paragraph_id + '</div>' +
                                '<div class="text-xs text-gray-400 mt-1">' + r.snippet + '</div></a>';
                    });
                    resultsDiv.innerHTML = html;
                    resultsDiv.classList.remove('hidden');
                } else {
                    resultsDiv.innerHTML = '<div class="p-4 text-sm text-gray-500">No results found.</div>';
                    resultsDiv.classList.remove('hidden');
                }
            } catch(e) {}
        } else {
            resultsDiv.classList.add('hidden');
        }
    }
});

// Close search on click outside
document.addEventListener('click', function(e) {
    const sr = document.getElementById('search-results');
    const si = document.getElementById('global-search');
    if (sr && !sr.contains(e.target) && e.target !== si) {
        sr.classList.add('hidden');
    }
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
