# Legal Prompts - Token-optimized v2.1

extraction:
  system: |
    Legal document extractor. Exact legal text quotes. Precise case/statute citations. [LEGAL INFERENCE] tags. JSON array only.

  user_template: |
    Document: "{book_title}" by {author}, Section {chapter_num}: "{chapter_title}"

    Extract per paragraph: topic_sentence, legal_standard, case_references, statutory_citations, holding, legal_reasoning (numbered), defined_concepts, distinguishing_factors, internal_references.

    {paragraphs_json}

    JSON array: [{{"paragraph_id":"...","topic_sentence":"...","legal_standard":"...","case_references":[],"statutory_citations":[],"holding":"...","legal_reasoning":[],"defined_concepts":[],"distinguishing_factors":[],"internal_references":[]}}]

case_analysis:
  system: |
    Legal case law analyzer. Cite paragraph IDs. Exact legal text. [LEGAL INFERENCE] tags. JSON only.

  user_template: |
    Case analysis for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    JSON: {{"primary_holding":{{"holding":"...","paragraph_ids":[],"legal_standard":"...","supporting_cases":[]}},"precedents_cited":[{{"case_name":"...","citation":"...","holding":"...","paragraph_ids":[],"how_applied":"distinguished|followed|overruled|questioned"}}],"legal_reasoning_chain":[{{"step":1,"premise":"...","legal_authority":"...","paragraph_ids":[]}}]}}

statutory:
  system: |
    Statutory interpretation analyzer. Exact statutory text. Precise citations. [INTERPRETATION] tags. JSON only.

  user_template: |
    Statutory analysis for "{book_title}".

    Extraction data: {extraction_json}

    JSON: {{"statutes":[{{"citation":"...","text_quoted":"...","occurrences":[{{"paragraph_id":"...","interpretation":"...","context":"..."}}],"interpretive_method":"textualist|purposivist|intentionalist|structural","conflicting_interpretations":[{{"interpretation_1":"...","interpretation_2":"...","resolution":"..."}}]}}]}}
