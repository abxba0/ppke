# Philosophy Prompts - Token-optimized v2.1

extraction:
  system: |
    Philosophy structural extractor. Full fidelity, exact quotes, [INFERENCE] tags. Use given paragraph IDs. JSON array only.

  user_template: |
    Book: "{book_title}" by {author}, Ch {chapter_num}: "{chapter_title}"

    Extract per paragraph: topic_sentence, function_in_argument (thesis/evidence/transition/definition/counter-argument/conclusion), explicit_claims (quoted), implicit_assumptions ([INFERENCE]), logical_steps (numbered), defined_concepts (exact), emotional_tone, tone_evidence (quoted), internal_references, is_argument_carrying (bool).

    {paragraphs_json}

    JSON array: [{{"paragraph_id":"...","topic_sentence":"...","function_in_argument":"...","explicit_claims":[],"implicit_assumptions":[],"logical_steps":[],"defined_concepts":[],"emotional_tone":"...","tone_evidence":"...","internal_references":[],"is_argument_carrying":bool}}]

logical_map:
  system: |
    Philosophy logical architecture analyst. Cite paragraph IDs for all claims. [INFERENCE] tags. Detect circular reasoning. JSON only.

  user_template: |
    Build logical architecture for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    JSON: {{"central_thesis":{{"claim":"...","paragraph_ids":[],"evidence":"..."}},"argument_threads":[{{"name":"...","premises":[{{"claim":"...","paragraph_ids":[],"is_inference":bool}}],"conclusion":{{"claim":"...","paragraph_ids":[]}},"logical_issues":[]}}],"key_assumptions":[{{"assumption":"[INFERENCE] ...","depends_on":[]}}]}}

concepts:
  system: |
    Philosophy concept tracker. Exact quotes per occurrence. Track semantic drift. [INFERENCE] tags. JSON only.

  user_template: |
    Build concept index for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    Track: occurrences (paragraph_id + exact quote + context), meaning evolution, related concepts.

    JSON: {{"concepts":[{{"name":"...","definition":"...","occurrences":[{{"paragraph_id":"...","quote":"...","usage_context":"..."}}],"semantic_shifts":[{{"from_id":"...","to_id":"...","description":"[INFERENCE] ..."}}],"related_concepts":[]}}]}}

patterns:
  system: |
    Philosophy pattern/tension detector. Cite paragraph IDs. [HYPOTHESIS] tags. Distinguish explicit vs inferred. JSON only.

  user_template: |
    Detect patterns in "{book_title}" by {author}.

    Extraction data: {extraction_json}

    Find: recurring metaphors, emotional arcs, structural repetition, logical recursion, internal contradictions.

    JSON: {{"patterns":[{{"type":"metaphor|emotional_arc|repetition|recursion|contradiction","description":"...","evidence":[{{"paragraph_id":"...","quote":"..."}}],"is_hypothesis":bool}}]}}

author_model:
  system: |
    Philosophy author model builder. Cite paragraph IDs. [INFERENCE] tags. Be specific. JSON only.

  user_template: |
    Build author model for "{book_title}" by {author}.

    Logical map: {logical_map_json}
    Concept index: {concept_index_json}
    Patterns: {patterns_json}

    Cover: ontology, epistemology, moral_framework, emotional_philosophy, logical_style, recurring_pattern, core_tensions.

    JSON: {{"ontology":{{"description":"...","evidence":[{{"paragraph_id":"...","quote":"..."}}]}},"epistemology":{{"description":"...","evidence":[]}},"moral_framework":{{"description":"...","evidence":[]}},"emotional_philosophy":{{"description":"...","evidence":[]}},"logical_style":{{"description":"...","evidence":[]}},"recurring_pattern":{{"description":"...","evidence":[]}},"core_tensions":[{{"tension":"...","evidence":[]}}]}}

cross_book:
  system: |
    Cross-book philosophy synthesizer. Cite as Book_Folder -> paragraph_id. Compare content not surface similarity. [HYPOTHESIS] tags. JSON only.

  user_template: |
    Cross-book synthesis. Question: {question}

    Books: {books_json}

    Compare: concept_definitions, ontology, epistemology, moral_framework, logical_style, structural_patterns.

    JSON: {{"comparisons":[{{"dimension":"...","description":"...","per_book":[{{"book_folder":"...","position":"...","evidence":"..."}}],"synthesis":"...","tensions":[],"is_hypothesis":bool}}],"cross_links":[{{"concept":"...","books":[],"relationship":"agreement|tension|evolution|contradiction","description":"..."}}],"overall_synthesis":"..."}}

single_book_query:
  system: |
    Philosophy knowledge retrieval. Cite paragraph IDs. Include verbatim quotes. Reconstruct logical chains. [INFERENCE] tags. JSON only.

  user_template: |
    Question about "{book_title}" by {author}: {question}

    Raw structure: {raw_structure}
    Logical map: {logical_map}
    Concept index: {concept_index}

    JSON: {{"answer":"...","paragraph_ids_used":[],"verbatim_quotes":[{{"paragraph_id":"...","quote":"..."}}],"logical_chain":[{{"step":1,"claim":"...","paragraph_id":"...","is_inference":bool}}],"confidence":"high|medium|low","notes":"..."}}

concept_dedup:
  system: |
    Semantic concept matcher. Group by philosophical idea, not string similarity. E.g. "Dasein"="Being-there"; "Will to Power"≠"Power". JSON only.

  user_template: |
    Group semantically equivalent concepts across books.

    Concepts by book: {concepts_by_book_json}

    JSON: {{"groups":[{{"canonical_name":"...","members":[{{"book_folder":"...","concept_name":"...","reason":"..."}}]}}],"ungrouped":[{{"book_folder":"...","concept_name":"..."}}]}}
