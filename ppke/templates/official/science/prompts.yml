# Science Prompts - Token-optimized v2.1

extraction:
  system: |
    Scientific text extractor. Exact quotes, precise numerical results, [INFERENCE] tags. Use given paragraph IDs. JSON array only.

  user_template: |
    Paper: "{book_title}" by {author}, Section {chapter_num}: "{chapter_title}"

    Extract per paragraph: topic_sentence, hypothesis, methodology, evidence (quoted), conclusions, limitations, epistemic_status (established/hypothesized/speculative/contested/replicated), defined_concepts (exact), internal_references, is_argument_carrying (bool).

    {paragraphs_json}

    JSON array: [{{"paragraph_id":"...","topic_sentence":"...","hypothesis":"...","methodology":[],"evidence":[],"conclusions":[],"limitations":[],"epistemic_status":"...","defined_concepts":[],"internal_references":[],"is_argument_carrying":bool}}]

methodology:
  system: |
    Scientific methodology analyzer. Cite paragraph IDs. Quote exact methods. [INFERENCE] tags. JSON only.

  user_template: |
    Analyze methodology for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    JSON: {{"research_design":{{"type":"experimental|observational|review|theoretical|mixed","description":"...","paragraph_ids":[]}},"methods":[{{"name":"...","description":"...","paragraph_ids":[],"strengths":[],"limitations":[]}}],"data_sources":[{{"source":"...","type":"primary|secondary|meta-analysis","paragraph_ids":[]}}],"analytical_approach":{{"description":"...","statistical_methods":[],"paragraph_ids":[]}}}}

evidence:
  system: |
    Scientific evidence mapper. Exact quotes. Cite paragraph IDs. Distinguish correlation/causation. [INFERENCE] tags. JSON only.

  user_template: |
    Map evidence for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    JSON: {{"evidence_chains":[{{"claim":"...","evidence":[{{"paragraph_id":"...","quote":"...","evidence_type":"experimental|observational|statistical|anecdotal"}}],"strength":"strong|moderate|weak","counter_evidence":[],"reasoning_type":"causal|correlational|descriptive|theoretical"}}],"key_findings":[{{"finding":"...","paragraph_ids":[],"epistemic_status":"established|hypothesized|speculative|contested"}}]}}

findings:
  system: |
    Scientific findings synthesizer. Cite paragraph IDs. Distinguish results from interpretations. [HYPOTHESIS] tags. JSON only.

  user_template: |
    Synthesize findings for "{book_title}" by {author}.

    Extraction data: {extraction_json}

    JSON: {{"key_findings":[{{"finding":"...","significance":"...","evidence":[{{"paragraph_id":"...","quote":"..."}}],"is_novel":bool}}],"theoretical_contributions":[{{"contribution":"...","paragraph_ids":[],"is_hypothesis":bool}}],"open_questions":[],"inconsistencies":[{{"description":"...","paragraph_ids":[]}}]}}
